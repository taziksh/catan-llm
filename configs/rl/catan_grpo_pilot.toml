# Whole-game pilot from public Qwen weights, not the dagger2/DPO policy.
# The per-decision GRPO experiment is scripts/run_grpo_trl.py; do not launch
# this config as its substitute.
name = "catan-grpo-pilot-qwen35-9b"
model = "Qwen/Qwen3.5-9B"
model_revision = "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
loss = "rl"
max_steps = 10
batch_size = 32
rollouts_per_example = 8
learning_rate = 1e-4
lora_alpha = 16
oversampling_factor = 1.0

[sampling]
max_tokens = 32
temperature = 1.0
enable_thinking = false

[[env]]
id = "taziksh/catan-v1"
version = "0.1.3"
args = { seed_start = 10000, num_seeds = 512, seats = "agent,value_function,value_function,value_function", invalid_retries = 1, vp_coef = 0.1, max_turns = 500, timeout_seconds = 1800 }

[eval]
interval = 10
num_examples = 8
rollouts_per_example = 8
skip_first_step = false

[eval.sampling]
max_tokens = 32
temperature = 0.7
enable_thinking = false

[[eval.env]]
id = "taziksh/catan-v1"
version = "0.1.3"
args = { seed_start = 0, num_seeds = 8, seats = "agent,value_function,value_function,value_function", invalid_retries = 1, vp_coef = 0.1, max_turns = 500, timeout_seconds = 1800 }
num_examples = 8
rollouts_per_example = 8

[checkpoints]
interval = 5
keep_cloud = 3

[adapters]
interval = 5
keep_last = 3
