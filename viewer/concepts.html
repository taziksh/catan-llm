<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>catan·llm surround concepts</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    display: grid;
    grid-template-rows: 42px 1fr;
    background: #25291f;
    color: #f8f2e4;
    font: 13px/1.2 "Gill Sans", "Avenir Next", sans-serif;
  }
  nav {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 9px;
    background: #2f3327;
    border-bottom: 1px solid #171a14;
  }
  nav strong {
    margin: 0 8px 0 3px;
    font: 700 14px "Iowan Old Style", Palatino, serif;
    letter-spacing: .01em;
  }
  nav button {
    appearance: none;
    border: 0;
    border-radius: 5px;
    padding: 7px 11px;
    background: #454b39;
    color: #dedfcf;
    font: 650 11px/1 "Gill Sans", "Avenir Next", sans-serif;
    cursor: pointer;
  }
  nav button[aria-current="true"] {
    background: #f1e5ca;
    color: #3e432d;
  }
  nav span {
    margin-left: auto;
    color: #adb39b;
    font-size: 10px;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #ded6c2; }
</style>
</head>
<body>
<nav aria-label="Visual concepts">
  <strong>Surround concepts</strong>
  <button type="button" data-concept="tabletop">A · Pastel tabletop</button>
  <button type="button" data-concept="notebook">B · Field notebook</button>
  <button type="button" data-concept="boardfirst">C · Board first</button>
  <span>same map · UI only</span>
</nav>
<iframe id="preview" title="Replay concept preview"></iframe>
<script>
const DEFAULT_FILE = "../data/eval_traces/n5_answeronly/value_function-value_function-llm-value_function_s0_c3cb7c0b.jsonl";
const params = new URLSearchParams(location.search);
const activeConcept = params.get("concept") || "tabletop";
const replayParams = new URLSearchParams({
  file: params.get("file") || DEFAULT_FILE,
  step: params.get("step") || "120",
});
const frame = document.querySelector("#preview");

document.querySelectorAll("[data-concept]").forEach((button) => {
  const selected = button.dataset.concept === activeConcept;
  button.setAttribute("aria-current", selected ? "true" : "false");
  button.addEventListener("click", () => {
    const next = new URL(location.href);
    next.searchParams.set("concept", button.dataset.concept);
    location.href = next;
  });
});

const sharedCss = `
  body {
    --quiet-ink: #4b4c31;
    --quiet-line: #b8aa84;
  }
  header, main, aside, footer, .card, .player, .model-seat { box-shadow: none !important; }
  header { flex: 0 0 auto; }
  main { min-height: 0; }
  #boardwrap { min-height: 0; }
  .model-seat { display: none !important; }
  .player::before { box-shadow: none !important; }
`;

const conceptCss = {
  tabletop: `
    body.concept-tabletop {
      --paper: #d6d0b8;
      --tray: #eee4cc;
      --card: #f5ecd7;
      --card-high: #faf1dd;
      --ink: #454a2f;
      --ink-dim: #747956;
      background: #c3d2c9;
    }
    body.concept-tabletop header {
      min-height: 37px;
      padding: 7px 13px;
      background: #ddd4bd;
      border-bottom: 1px solid #c7bb9c;
    }
    body.concept-tabletop header h1 { font-size: 17px; }
    body.concept-tabletop .concept-player-strip {
      flex: 0 0 auto;
      padding: 7px 11px 8px;
      background: #e8dec7;
      border-bottom: 1px solid #c8ba98;
    }
    body.concept-tabletop .players-card { padding: 0; }
    body.concept-tabletop .players-card .section-head { display: none; }
    body.concept-tabletop #players {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }
    body.concept-tabletop .player {
      min-width: 0;
      margin: 0;
      padding: 6px 8px 6px 13px;
      border-radius: 4px;
      border-left: 4px solid var(--player-color);
      background: #f8efdcc4;
    }
    body.concept-tabletop .player::before { display: none; }
    body.concept-tabletop .pname { font-size: 12px; }
    body.concept-tabletop .pvp { font-size: 14px; }
    body.concept-tabletop .hand { margin-top: 3px; }
    body.concept-tabletop .player .res { transform: scale(.88); transform-origin: left center; }
    body.concept-tabletop main { padding: 0; gap: 0; }
    body.concept-tabletop #boardwrap { border-radius: 0; }
    body.concept-tabletop aside {
      width: 286px;
      gap: 0;
      padding: 16px 15px 12px;
      border-radius: 0;
      border-left: 1px solid #c0b18d;
      background:
        linear-gradient(90deg, #c3b6952e 0 1px, transparent 1px 100%),
        #eee4cc;
    }
    body.concept-tabletop aside .card {
      padding: 0 0 15px;
      margin: 0 0 14px;
      border-radius: 0;
      background: transparent;
    }
    body.concept-tabletop aside .card + .card {
      border-top: 1px solid #bcae8b80;
      padding-top: 14px;
    }
    body.concept-tabletop .now-card #phase {
      grid-template-columns: auto 1fr;
    }
    body.concept-tabletop .now-card .turn-number { font-size: 34px; }
    body.concept-tabletop .decision-card {
      margin-bottom: auto;
    }
    body.concept-tabletop footer {
      min-height: 42px;
      padding: 6px 10px;
      background: #ded3b9;
      border-top: 1px solid #c2b38e;
    }
    body.concept-tabletop footer button,
    body.concept-tabletop footer select {
      border-radius: 4px;
      background: #f4ead4;
    }
  `,
  notebook: `
    body.concept-notebook {
      --paper: #d3cdb8;
      --tray: #f5ecd8;
      --card: transparent;
      --card-high: #f8f0de;
      --ink: #48462f;
      --ink-dim: #767557;
      background: #d7d0bb;
    }
    body.concept-notebook header {
      min-height: 40px;
      background: #d8cfb6;
      border-bottom: 1px solid #afa17c;
    }
    body.concept-notebook header h1 {
      font-style: italic;
      font-weight: 600;
    }
    body.concept-notebook main {
      padding: 9px 9px 0;
      gap: 0;
      background: #cfc7ae;
    }
    body.concept-notebook #boardwrap {
      border-radius: 5px 0 0 5px;
    }
    body.concept-notebook aside {
      width: 318px;
      gap: 0;
      padding: 18px 18px 22px 27px;
      border-radius: 0 5px 5px 0;
      border-left: 0;
      background:
        linear-gradient(90deg, transparent 0 15px, #c8806847 15px 16px, transparent 16px),
        repeating-linear-gradient(0deg, transparent 0 30px, #8ea29a2b 30px 31px),
        #f5ecd8;
    }
    body.concept-notebook aside .card {
      position: relative;
      margin: 0 0 11px;
      padding: 5px 3px 12px;
      border-radius: 0;
      background: transparent;
    }
    body.concept-notebook .now-card {
      border-bottom: 2px solid #777651;
    }
    body.concept-notebook .section-head { margin-bottom: 8px; }
    body.concept-notebook .card h2 {
      font-style: italic;
      font-size: 16px;
      font-weight: 600;
    }
    body.concept-notebook .section-note { font-size: 8px; }
    body.concept-notebook .player {
      margin: 0 0 4px;
      padding: 6px 5px 6px 16px;
      border-radius: 0;
      border-bottom: 1px solid #918c6f4a;
      background: transparent;
    }
    body.concept-notebook .player::before {
      left: 2px;
      top: 11px;
      width: 5px;
      height: 16px;
      border-radius: 1px;
    }
    body.concept-notebook .decision-card {
      padding: 9px 10px 13px;
      background: #f3dfb8b8;
      transform: rotate(-.25deg);
    }
    body.concept-notebook footer {
      min-height: 45px;
      margin: 0 9px 9px;
      border-top: 1px solid #b9aa85;
      background: #e7dcc4;
    }
    body.concept-notebook footer button,
    body.concept-notebook footer select {
      border-radius: 2px;
      background: transparent;
      box-shadow: inset 0 0 0 1px #9e9272 !important;
    }
  `,
  boardfirst: `
    body.concept-boardfirst {
      --paper: #d7d0bb;
      --tray: #eee5d0;
      --card: #f5ecd9;
      --card-high: #faf3e2;
      --ink: #464a2b;
      --ink-dim: #747b51;
      background: #74b2df;
    }
    body.concept-boardfirst header {
      min-height: 36px;
      padding: 6px 12px;
      background: #e6dcc5e8;
      border-bottom: 0;
    }
    body.concept-boardfirst header h1 { font-size: 16px; }
    body.concept-boardfirst main {
      display: block;
      padding: 0;
      position: relative;
    }
    body.concept-boardfirst #boardwrap {
      width: 100%;
      height: 100%;
      border-radius: 0;
    }
    body.concept-boardfirst #caption { display: none; }
    body.concept-boardfirst aside { display: none; }
    body.concept-boardfirst .players-card {
      position: absolute;
      z-index: 4;
      top: 12px;
      left: 50%;
      width: min(680px, calc(100% - 36px));
      transform: translateX(-50%);
      padding: 7px 9px;
      border-radius: 9px;
      background: #f5ecd9e8;
      backdrop-filter: blur(7px);
    }
    body.concept-boardfirst .players-card .section-head { display: none; }
    body.concept-boardfirst #players {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
    }
    body.concept-boardfirst .player {
      min-width: 0;
      margin: 0;
      padding: 5px 7px 5px 14px;
      border-radius: 5px;
      background: #fff8e98c;
    }
    body.concept-boardfirst .player::before {
      left: 5px;
      top: 9px;
      width: 5px;
      height: calc(100% - 18px);
      border-radius: 2px;
    }
    body.concept-boardfirst .pname { font-size: 11px; }
    body.concept-boardfirst .pvp { font-size: 13px; }
    body.concept-boardfirst .hand { margin-top: 2px; }
    body.concept-boardfirst .players-card .hand { display: none; }
    body.concept-boardfirst .player .res { transform: scale(.8); transform-origin: left center; }
    body.concept-boardfirst .now-card,
    body.concept-boardfirst .bank-card,
    body.concept-boardfirst .decision-card {
      position: absolute;
      z-index: 4;
      bottom: 13px;
      margin: 0;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f7eedbe8;
      backdrop-filter: blur(7px);
    }
    body.concept-boardfirst .now-card {
      left: 50%;
      width: 282px;
      transform: translateX(-50%);
    }
    body.concept-boardfirst .now-card .section-head,
    body.concept-boardfirst .bank-card .section-head { display: none; }
    body.concept-boardfirst .now-card #phase {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    body.concept-boardfirst .now-card .turn-number { font-size: 24px; }
    body.concept-boardfirst .bank-card {
      left: 13px;
      width: 250px;
    }
    body.concept-boardfirst .bank-card #bank { margin: 0; }
    body.concept-boardfirst .decision-card {
      right: 13px;
      width: 230px;
    }
    body.concept-boardfirst .decision-card .section-head { margin-bottom: 5px; }
    body.concept-boardfirst .decision-card #actions,
    body.concept-boardfirst .decision-card #alternatives-label { display: none !important; }
    body.concept-boardfirst footer {
      min-height: 43px;
      padding: 5px 10px;
      background: #dfd5bde8;
      border-top: 0;
    }
    body.concept-boardfirst footer button,
    body.concept-boardfirst footer select {
      border-radius: 4px;
      background: #f5ecd7;
    }
  `,
};

function cardByHeading(doc, heading) {
  return [...doc.querySelectorAll("aside .card")].find(
    (card) => card.querySelector("h2")?.textContent.trim() === heading
  );
}

function applyConcept() {
  const doc = frame.contentDocument;
  if (!doc?.body) return;
  doc.body.classList.add(`concept-${activeConcept}`);

  const playersCard = cardByHeading(doc, "Players");
  const nowCard = cardByHeading(doc, "Now");
  const bankCard = cardByHeading(doc, "Bank");
  const decisionCard = cardByHeading(doc, "Decision");
  playersCard?.classList.add("players-card");

  if (activeConcept === "tabletop" && playersCard) {
    const strip = doc.createElement("div");
    strip.className = "concept-player-strip";
    strip.append(playersCard);
    doc.querySelector("header")?.after(strip);
  }

  if (activeConcept === "boardfirst") {
    const boardwrap = doc.querySelector("#boardwrap");
    [playersCard, nowCard, bankCard, decisionCard].forEach((card) => {
      if (card && boardwrap) boardwrap.append(card);
    });
  }

  const style = doc.createElement("style");
  style.textContent = sharedCss + conceptCss[activeConcept];
  doc.head.append(style);
}

frame.addEventListener("load", applyConcept);
frame.src = `./replay.html?${replayParams}`;
</script>
</body>
</html>
