<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>catan-llm replay</title>
<style>
  :root {
    --sea: #74b2df;
    --paper: #ded6c2;
    --tray: #eee5d0;
    --card: #f4ecd9;
    --card-high: #faf3e2;
    --ink: #464a2b;
    --ink-dim: #747b51;
    --control: #e4d8bc;
    --track: #c8ba97;
    --accent: #be6e30;
    --good: #77a61c;
    --moss: #5c6117;
    --wheat: #c1b13f;
    --ui-font: "Gill Sans", "Trebuchet MS", "Avenir Next", sans-serif;
    --display-font: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 13.5px/1.4 var(--ui-font);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 9px 14px; background: #e9dfc8;
    box-shadow: none;
    position: relative; z-index: 2;
  }
  header h1 {
    font: 700 19px/1 var(--display-font);
    letter-spacing: -0.02em; white-space: nowrap;
  }
  header h1 span { color: var(--accent); }
  header .meta {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--ink-dim); font-size: 11.5px;
  }
  #openfile {
    flex: none; height: 27px; padding: 3px 9px;
    background: var(--control); color: var(--ink); border: 0;
    border-radius: 6px; font: 600 10.5px var(--ui-font); cursor: pointer;
    box-shadow: 0 1px 3px #4e512e1c;
  }
  #openfile:hover { background: #ddcdab; color: #7c4e25; }
  main { flex: 1; display: flex; min-height: 0; padding: 12px; gap: 12px; }
  #boardwrap {
    flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0;
    background: var(--sea);
    border: 0; border-radius: 10px;
    box-shadow: none;
    position: relative; overflow: hidden;
  }
  #board { display: block; width: 100%; height: 100%; }
  #caption {
    position: absolute; left: 50%; bottom: 11px; transform: translateX(-50%);
    background: #faf3e2f2; color: var(--ink);
    border: 0; border-radius: 7px;
    padding: 7px 12px; font-size: 12.5px; font-weight: 600;
    box-shadow: 0 4px 16px #4e512e26; white-space: nowrap;
    transition: opacity .2s; opacity: 0; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  }
  #caption.show { opacity: 1; }
  #caption .actor-name {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    margin-right: 5px; color: var(--actor-color, var(--accent));
  }
  aside {
    width: 336px; overflow-y: auto; font-size: 12.5px;
    display: flex; flex-direction: column; gap: 2px;
    background:
      radial-gradient(circle at 18% -8%, #fff8e733 0 22%, transparent 54%),
      var(--tray);
    border: 0; border-radius: 10px;
    box-shadow: none;
    padding: 6px;
    scrollbar-width: none;
  }
  aside::-webkit-scrollbar, #actions::-webkit-scrollbar { display: none; }
  .card {
    background: transparent; border: 0;
    border-radius: 0; padding: 9px 9px 11px; box-shadow: none;
  }
  .now-card {
    margin-bottom: 1px; padding: 11px 11px 12px;
    background: #faf1dc; border-radius: 9px;
    box-shadow: none;
  }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-bottom: 9px;
  }
  .card h2 {
    color: var(--ink); margin: 0;
    font: 700 14px/1 var(--display-font); letter-spacing: .005em;
  }
  .card h2::after { content: none; }
  .section-note {
    color: var(--ink-dim); font-size: 8.5px; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase;
  }
  .player {
    position: relative; border-radius: 8px; padding: 8px 9px 8px 24px; margin-bottom: 6px;
    border: 0; background: #faf3e276;
  }
  .player::before {
    content: ""; position: absolute; left: 10px; top: 13px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--player-color, var(--ink-dim));
    box-shadow: 0 1px 2px #4e512e30;
  }
  .player:last-child { margin-bottom: 0; }
  .player.actor {
    background: color-mix(in srgb, var(--player-color) 10%, var(--card-high));
    box-shadow: none;
  }
  .prow { display: flex; align-items: center; gap: 6px; }
  .pname {
    color: color-mix(in srgb, var(--player-color) 68%, var(--ink));
    font: 700 13.5px var(--display-font); letter-spacing: .005em;
  }
  .ptag {
    color: var(--ink-dim); background: #e7dcc2b3;
    border-radius: 8px; padding: 1px 5px; font-size: 8.5px; font-weight: 600;
  }
  .ptag.is-model { background: #dfe7bd; color: var(--moss); }
  .vp {
    margin-left: auto; display: inline-flex; align-items: baseline; gap: 2px;
    font: 700 17px var(--display-font);
  }
  .vp small {
    color: var(--ink-dim); font: 700 7px var(--ui-font);
    letter-spacing: .08em; text-transform: uppercase;
  }
  .hand {
    color: var(--ink); font-size: 11px; margin-top: 6px;
    display: flex; align-items: center; flex-wrap: wrap; column-gap: 5px; row-gap: 3px;
  }
  .res, .stat {
    display: inline-flex; align-items: baseline; gap: 3px;
    border: 0; border-radius: 4px; padding: 0 2px 0 0;
    line-height: 1.25; background: transparent;
  }
  .res::before {
    content: ""; align-self: center; width: 16px; height: 16px;
    border: 0; border-radius: 3px;
    background-position: center; background-repeat: no-repeat; background-size: 22px 26px;
    box-shadow: 0 1px 2px #4e512e24;
  }
  .res-name {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap;
  }
  .stat-name {
    font-size: 8.5px; font-weight: 700; letter-spacing: .045em; text-transform: uppercase;
  }
  .res b { font-size: 11.5px; }
  .stat b { font-size: 10.5px; }
  .res-wood::before { background-image: url("assets/jsettlers2/woodHex.gif"); }
  .res-brick::before { background-image: url("assets/jsettlers2/clayHex.gif"); }
  .res-sheep::before { background-image: url("assets/jsettlers2/sheepHex.gif"); }
  .res-wheat::before { background-image: url("assets/jsettlers2/wheatHex.gif"); }
  .res-ore::before { background-image: url("assets/jsettlers2/oreHex.gif"); }
  .stat {
    color: var(--ink-dim); border: 0;
    border-radius: 0; padding: 0 1px; background: transparent;
  }
  .badge {
    font-size: 8px; background: var(--accent); color: var(--card-high);
    border-radius: 7px; padding: 1px 5px; margin-left: 2px; font-weight: 700;
  }
  .bank-card .hand {
    margin-top: 0; padding: 8px 9px;
    background: #e6dbc0a8; border-radius: 8px;
  }
  #decision {
    padding: 9px 10px 10px; border-radius: 8px;
    background: color-mix(in srgb, var(--actor-color) 10%, var(--card-high));
    box-shadow: none;
  }
  .decision-kicker {
    display: block; margin-bottom: 2px;
    color: color-mix(in srgb, var(--actor-color) 72%, var(--ink));
    font-size: 8px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  }
  .decision-text {
    display: block; color: var(--ink);
    font: 700 13.5px/1.25 var(--display-font);
  }
  #alternatives-label {
    display: none; margin: 9px 5px 3px;
    color: var(--ink-dim); font-size: 8.5px; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase;
  }
  #actions { max-height: 92px; overflow-y: auto; scrollbar-width: none; }
  #actions div {
    padding: 2.5px 6px; border-radius: 4px; color: var(--ink-dim);
    font-size: 10.5px; font-family: "SFMono-Regular", Consolas, monospace;
  }
  #phase {
    display: grid; grid-template-columns: auto 1fr;
    align-items: end; gap: 10px;
  }
  #phase .turn {
    color: var(--ink); font: 700 28px/.82 var(--display-font);
    letter-spacing: -.035em;
  }
  #phase .turn small {
    display: block; margin-bottom: 4px;
    color: var(--ink-dim); font: 700 8px/1 var(--ui-font);
    letter-spacing: .09em; text-transform: uppercase;
  }
  #phase .actor-label {
    display: block;
    color: color-mix(in srgb, var(--actor-color) 72%, var(--ink));
    font: 700 12px/1.1 var(--display-font);
  }
  #phase .phase-name {
    display: block; margin-top: 2px;
    color: var(--ink-dim); font-size: 8.5px; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase;
  }
  #dice {
    min-height: 34px; margin-top: 9px; padding: 5px 7px;
    display: flex; align-items: center; gap: 6px;
    border-radius: 7px; background: #e8dcc09e;
    color: var(--ink-dim); font-size: 8.5px; font-weight: 700;
    letter-spacing: .045em; text-transform: uppercase;
  }
  #dice:empty { display: none; }
  .die {
    display: inline-flex; align-items: center; justify-content: center;
    width: 27px; height: 27px; border-radius: 7px;
    background: #fbf3e1; color: var(--ink);
    font: 700 16px var(--display-font);
    box-shadow: 0 2px 5px #4e512e16, inset 0 0 0 1px #9f906a3d;
  }
  .dice-op { color: #918968; font-size: 12px; }
  .dice-total {
    margin-left: auto; color: var(--ink);
    font-size: 11.5px; letter-spacing: .01em; text-transform: none;
  }
  #outcome {
    display: none; margin-top: 9px; padding: 7px 9px; border-radius: 7px;
    background: #dfe7bd; color: var(--moss); font-size: 11.5px; font-weight: 700;
  }
  .model-seat {
    margin: auto 4px 2px; padding: 8px 10px;
    display: flex; align-items: center; gap: 9px;
    background: #e5dac0b8; border-radius: 8px;
    color: var(--ink-dim);
  }
  .model-seat.active {
    background: color-mix(in srgb, var(--model-color) 10%, var(--card-high));
  }
  .model-seat svg {
    width: 27px; height: 31px; flex: none; overflow: visible;
    filter: drop-shadow(0 2px 2px #4e512e26);
  }
  .model-seat-copy { min-width: 0; }
  .model-seat-copy small {
    display: block; font-size: 8px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .model-seat-copy strong {
    display: block; color: var(--ink);
    font: 700 12.5px var(--display-font);
  }
  #model-seat-status {
    margin-left: auto; color: var(--ink-dim);
    font-size: 8px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  }
  footer {
    display: flex; align-items: center; gap: 7px;
    min-height: 44px; padding: 7px 12px;
    background: #e8dfca; border: 0;
    box-shadow: none;
    position: relative; z-index: 2;
  }
  .transport, .model-jump {
    display: flex; align-items: stretch; gap: 3px;
    background: transparent; border: 0;
  }
  .timeline { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 120px; }
  footer button {
    height: 28px; background: var(--card-high); color: var(--ink);
    border: 0; border-radius: 6px;
    padding: 4px 9px; cursor: pointer;
    font: 600 11.5px var(--ui-font); box-shadow: 0 1px 3px #4e512e17;
  }
  footer button:hover { background: #f0e4ca; color: #7c4e25; }
  footer button:disabled {
    background: #eee5d080; color: #9b9478; cursor: default; opacity: .48;
    box-shadow: none;
  }
  footer button:disabled:hover { background: #eee5d080; color: #9b9478; filter: none; }
  #playpause {
    background: var(--accent); color: var(--card-high);
    min-width: 50px;
  }
  #playpause:hover { color: var(--card-high); filter: brightness(1.05); }
  #slider {
    flex: 1; height: 18px; margin: 0; appearance: none;
    -webkit-appearance: none; background: transparent;
  }
  #slider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 3px; background: var(--track);
  }
  #slider::-webkit-slider-thumb {
    width: 12px; height: 12px; margin-top: -4px;
    -webkit-appearance: none; appearance: none; border-radius: 50%;
    border: 0; background: var(--accent);
    box-shadow: 0 2px 4px #6944244a;
  }
  #slider::-moz-range-track {
    height: 4px; border: 0; border-radius: 3px; background: var(--track);
  }
  #slider::-moz-range-thumb {
    width: 12px; height: 12px; border: 0;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 2px 4px #6944244a;
  }
  #step { color: var(--ink-dim); font-size: 10.5px; min-width: 88px; text-align: right; }
  select {
    height: 28px; background: var(--card-high); color: var(--ink);
    border: 0; border-radius: 6px;
    padding: 3px 6px; font: 600 11px var(--ui-font);
    box-shadow: 0 1px 3px #4e512e17;
  }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 0; box-shadow: 0 0 0 3px #76864c52;
  }
  #drop {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #e1dac8f2; color: var(--ink); z-index: 10; cursor: pointer;
  }
  .drop-card {
    width: min(360px, calc(100vw - 40px)); padding: 30px 34px;
    background: var(--card-high); border: 0; border-radius: 10px;
    box-shadow: 0 10px 32px #4e512e24; text-align: center;
  }
  .drop-card strong { display: block; font: 700 23px var(--display-font); }
  .drop-card span {
    display: block; margin-top: 7px; color: var(--ink-dim);
    font: 12px/1.45 var(--ui-font);
  }
  #drop.hidden { display: none; }
  .piece.new { animation: pop .35s cubic-bezier(.2,1.6,.4,1); transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @media (max-width: 940px) {
    aside { width: 300px; }
  }
</style>
</head>
<body>
<header>
  <h1>catan<span>·</span>llm replay</h1>
  <span class="meta" id="gameinfo"></span>
  <button id="openfile" type="button">Open replay</button>
  <input type="file" id="file" accept=".jsonl" hidden>
</header>
<main>
  <div id="boardwrap">
    <svg id="board" viewBox="-6.05 -5.43 12.1 10.86" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="caption"></div>
  </div>
  <aside>
    <div class="card now-card">
      <div class="section-head">
        <h2>Now</h2>
        <span class="section-note" id="actor-note"></span>
      </div>
      <div id="phase"></div>
      <div id="dice"></div>
      <div id="outcome"></div>
    </div>
    <div class="card">
      <div class="section-head">
        <h2>Players</h2>
        <span class="section-note" id="players-note"></span>
      </div>
      <div id="players"></div>
    </div>
    <div class="card bank-card">
      <div class="section-head">
        <h2>Bank</h2>
        <span class="section-note">supply</span>
      </div>
      <div id="bank" class="hand"></div>
    </div>
    <div class="card decision-card">
      <div class="section-head">
        <h2>Decision</h2>
        <span class="section-note" id="action-count"></span>
      </div>
      <div id="decision"></div>
      <div id="alternatives-label">Other legal moves</div>
      <div id="actions"></div>
    </div>
    <div class="model-seat" id="model-seat">
      <svg viewBox="-11 -17 22 26" aria-hidden="true">
        <polygon id="model-seat-piece"></polygon>
      </svg>
      <span class="model-seat-copy">
        <small>Model seat</small>
        <strong id="model-seat-label"></strong>
      </span>
      <span id="model-seat-status"></span>
    </div>
  </aside>
</main>
<footer>
  <div class="transport">
    <button id="prev">Prev</button>
    <button id="playpause">Play</button>
    <button id="next">Next</button>
  </div>
  <div class="timeline">
    <input type="range" id="slider" min="0" max="0" value="0">
    <span id="step"></span>
  </div>
  <div class="model-jump">
    <button id="prevllm" title="previous model decision">Prev model</button>
    <button id="nextllm" title="next model decision">Next model</button>
  </div>
  <select id="speed">
    <option value="2">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="0.5">2×</option>
    <option value="0.25">4×</option>
  </select>
</footer>
<div id="drop">
  <div class="drop-card">
    <strong>Open a replay</strong>
    <span>Drop a JSONL trace here, or click to choose one.</span>
  </div>
</div>
<script>

  10: { fill: "#ff7d00", stroke: "#7c3c00" },
  11: { fill: "#ffbd00", stroke: "#7c5c00" },
  12: { fill: "#ffff00", stroke: "#7c7c00" },
};
const JSETTLERS_SHAPES = {
  settlement: [
    [-7, -7], [0, -14], [7, -7], [7, 5], [-7, 5], [-7, -7], [7, -7],
  ],
  city: [
    [-10, -8], [-4, -14], [2, -8], [2, -4],
    [10, -4], [10, 6], [-10, 6], [-10, -8],
  ],
  robber: [
    [-2, -2], [-4, -4], [-4, -6], [-2, -8], [2, -8], [4, -6], [4, -4],
    [2, -2], [4, 0], [4, 8], [-4, 8], [-4, 0], [-2, -2], [2, -2],
  ],
};
const JSETTLERS_SCALE = 2 / 64;
const PIECE_OUTLINE = "#363a25";
const PIECE_STROKE = 0.021;
const BOARD_SCALE_X = (54 * JSETTLERS_SCALE) / SQRT3;
const BOARD_SCALE_Y = (46 * JSETTLERS_SCALE) / 1.5;
const HEX_IMAGE_WIDTH = 55 * JSETTLERS_SCALE;
const HEX_IMAGE_HEIGHT = 64 * JSETTLERS_SCALE;
const HEX_IMAGE_LEFT = 27 * JSETTLERS_SCALE;
const HEX_IMAGE_TOP = 31 * JSETTLERS_SCALE;
const RES_LABEL = {
  WOOD: "wood",
  BRICK: "brick",
  SHEEP: "sheep",
  WHEAT: "wheat",
  ORE: "ore",
};

let game = null;
let decisions = [];
let llmSeat = null;
let idx = 0;
let timer = null;
let prevPieces = new Set();

const board = document.getElementById("board");

function el(name, attrs, text) {
  const node = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

function boardPoint([x, y]) {
  return [x * BOARD_SCALE_X, y * BOARD_SCALE_Y];
}

function drawArtTile(x, y, resource) {
  board.appendChild(el("image", {
    href: TILE_ART[resource],
    x: x - HEX_IMAGE_LEFT, y: y - HEX_IMAGE_TOP,
    width: HEX_IMAGE_WIDTH, height: HEX_IMAGE_HEIGHT,
    "preserveAspectRatio": "none",
  }));
}

function drawWaterField() {
  for (let row = -4; row <= 4; row++) {
    for (let col = -6; col <= 6; col++) {
      const logical = [SQRT3 * (col + row / 2), 1.5 * row];
      if (logical[0] < -7.2 || logical[0] > 7.2) continue;
      const [x, y] = boardPoint(logical);
      drawArtTile(x, y, "WATER");
    }
  }
}

function nearestWaterCenter(x, y) {
  return GEO.water.map(boardPoint).reduce((best, point) => {
    const distance = Math.hypot(point[0] - x, point[1] - y);
    return distance < best.distance ? { point, distance } : best;
  }, { point: boardPoint(GEO.water[0]), distance: Infinity }).point;
}

function drawPort(defs, port, index) {
  const [ax, ay] = boardPoint(GEO.nodes[port.nodes[0]]);
  const [bx, by] = boardPoint(GEO.nodes[port.nodes[1]]);
  const [wx, wy] = nearestWaterCenter((ax + bx) / 2, (ay + by) / 2);
  const outerRadius = 14.5 * JSETTLERS_SCALE;
  const innerRadius = 14 * JSETTLERS_SCALE;
  const clipId = `port-window-${index}`;
  const clip = el("clipPath", { id: clipId });
  clip.appendChild(el("circle", { cx: wx, cy: wy, r: innerRadius }));
  defs.appendChild(clip);

  board.appendChild(el("circle", {
    cx: wx, cy: wy, r: outerRadius, fill: "#faf3e2",
  }));
  board.appendChild(el("image", {
    href: port.resource ? TILE_ART[port.resource] : "assets/jsettlers2/miscPort.gif",
    x: wx - HEX_IMAGE_LEFT, y: wy - HEX_IMAGE_TOP,
    width: HEX_IMAGE_WIDTH, height: HEX_IMAGE_HEIGHT,
    "preserveAspectRatio": "none",
    "clip-path": `url(#${clipId})`,
  }));
}

function offsetShapePoints(cx, cy, points, scale = JSETTLERS_SCALE) {
  return points
    .map(([x, y]) => `${(cx + x * scale).toFixed(3)},${(cy + y * scale).toFixed(3)}`)
    .join(" ");
}

function roadPoints(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const length = Math.hypot(dx, dy);
  const ux = dx / length, uy = dy / length;
  const px = -uy, py = ux;
  const trim = 1 / 32;
  const halfWidth = 2.5 * JSETTLERS_SCALE;
  const x1 = ax + ux * trim, y1 = ay + uy * trim;
  const x2 = bx - ux * trim, y2 = by - uy * trim;
  return [
    [x1 + px * halfWidth, y1 + py * halfWidth],
    [x2 + px * halfWidth, y2 + py * halfWidth],
    [x2 - px * halfWidth, y2 - py * halfWidth],
    [x1 - px * halfWidth, y1 - py * halfWidth],
  ].map(([x, y]) => `${x.toFixed(3)},${y.toFixed(3)}`).join(" ");
}

function pieceShape(x, y, kind, color, isNew) {
  const g = el("g", { class: "piece" + (isNew ? " new" : "") });
  g.appendChild(el("polygon", {
    points: offsetShapePoints(x, y, JSETTLERS_SHAPES[kind]),
    fill: color, stroke: PIECE_OUTLINE, "stroke-width": PIECE_STROKE,
    "stroke-opacity": 0.84, "stroke-linejoin": "round",
  }));
  return g;
}

function drawStatic() {
  board.innerHTML = "";
  const defs = el("defs", {});
  board.appendChild(defs);
  drawWaterField();

  for (const tile of game.layout.tiles) {
    const [x, y] = boardPoint(GEO.tiles[tile.id]);
    drawArtTile(x, y, tile.resource || "DESERT");
  }
  game.layout.ports.forEach((port, index) => drawPort(defs, port, index));

  for (const tile of game.layout.tiles) {
    if (!tile.number) continue;
    const [x, y] = boardPoint(GEO.tiles[tile.id]);
    const token = NUMBER_TOKEN[tile.number];
    board.appendChild(el("circle", {
      cx: x, cy: y, r: 10 * JSETTLERS_SCALE, fill: token.fill,
      stroke: token.stroke, "stroke-width": 0.016, "stroke-opacity": 0.58,
    }));
    board.appendChild(el("text", {
      x, y: y + 0.015, fill: "#000",
      "font-size": 13 * JSETTLERS_SCALE, "font-weight": 700,
      "text-anchor": "middle", "dominant-baseline": "central",
      "font-family": "Dialog, Arial, sans-serif",
    }, tile.number));
  }
  board.appendChild(el("g", { id: "dyn" }));
  prevPieces = new Set();
}

function drawState(d) {
  const dyn = board.querySelector("#dyn");
  dyn.innerHTML = "";
  const pieces = new Set();
  for (const [a, b, color] of d.board.roads) {
    const key = `r${a}-${b}`;
    pieces.add(key);
    const [ax, ay] = boardPoint(GEO.nodes[a]);
    const [bx, by] = boardPoint(GEO.nodes[b]);
    const g = el("g", { class: "piece" + (prevPieces.has(key) ? "" : " new") });
    g.appendChild(el("polygon", {
      points: roadPoints(ax, ay, bx, by),
      fill: PLAYER_COLORS[color], stroke: PIECE_OUTLINE,
      "stroke-width": PIECE_STROKE, "stroke-opacity": 0.84,
      "stroke-linejoin": "round",
    }));
    dyn.appendChild(g);
  }
  for (const [node, color, kind] of d.board.buildings) {
    const key = `b${node}-${kind}`;
    pieces.add(key);
    const [x, y] = boardPoint(GEO.nodes[node]);
    dyn.appendChild(pieceShape(
      x, y, kind === "CITY" ? "city" : "settlement",
      PLAYER_COLORS[color], !prevPieces.has(key),
    ));
  }
  if (d.board.robber !== null && d.board.robber !== undefined) {
    const key = `rob${d.board.robber}`;
    pieces.add(key);
    const [x, y] = boardPoint(GEO.tiles[d.board.robber]);
    const g = el("g", { class: "piece" + (prevPieces.has(key) ? "" : " new") });
    g.appendChild(el("polygon", {
      points: offsetShapePoints(x, y, JSETTLERS_SHAPES.robber),
      fill: "#bbbba5", stroke: PIECE_OUTLINE,
      "stroke-width": PIECE_STROKE, "stroke-opacity": 0.84,
      "stroke-linejoin": "round",
    }));
    dyn.appendChild(g);
  }
  prevPieces = pieces;
}

const VERB = {
  BUILD_SETTLEMENT: (v) => `builds a settlement @ node ${v}`,
  BUILD_CITY: (v) => `upgrades to a city @ node ${v}`,
  BUILD_ROAD: (v) => `builds a road ${Array.isArray(v) ? v.join("–") : v}`,
  BUY_DEVELOPMENT_CARD: () => "buys a dev card",
  PLAY_KNIGHT_CARD: () => "plays a knight",
  MOVE_ROBBER: (v) => `moves the robber`,
  MARITIME_TRADE: () => "trades with the bank",
  ROLL: () => "rolls",
  END_TURN: () => "ends the turn",
  DISCARD: () => "discards",
};

function fmtAction(action) {
  const [kind, value] = action;
  const label = kind.replaceAll("_", " ").toLowerCase();
  if (value === null || value === undefined) return label;
  if (kind === "BUILD_ROAD")
    return `${label} · edge ${value[0]}–${value[1]}`;
  if (kind === "BUILD_SETTLEMENT" || kind === "BUILD_CITY")
    return `${label} · node ${value}`;
  if (kind === "MOVE_ROBBER") {
    const victim = value[1] ? ` · from ${value[1].toLowerCase()}` : "";
    return `${label} · tile ${value[0]}${victim}`;
  }
  if (kind === "MARITIME_TRADE") {
    const give = value[0].toLowerCase();
    const receive = value[value.length - 1].toLowerCase();
    return `trade · ${value.length - 1} ${give} for ${receive}`;
  }
  if (kind === "DISCARD_RESOURCE")
    return `discard · ${value.toLowerCase()}`;
  return `${label} · ${Array.isArray(value) ? value.filter(Boolean).join(" · ") : value}`;
}

function caption(d) {
  const cap = document.getElementById("caption");
  const action = d.legal_actions[d.chosen_action];
  if (!action) { cap.classList.remove("show"); return; }
  const [kind, value] = action;
  const verb = VERB[kind] ? VERB[kind](value) : fmtAction(action).toLowerCase();
  cap.style.setProperty("--actor-color", PLAYER_UI_COLORS[d.actor]);
  cap.innerHTML =
    `<span class="actor-name">${d.actor}</span>${verb}`;
  cap.classList.add("show");
}

function fmtHand(hand) {
  const parts = Object.entries(RES_LABEL)
    .filter(([resource]) => hand[resource] > 0)
    .map(([resource, label]) =>
      `<span class="res res-${label}" title="${label}"><span class="res-name">${label}</span><b>${hand[resource]}</b></span>`);
  return parts.length ? parts.join("") : '<span class="stat">none</span>';
}

function stat(label, value) {
  return `<span class="stat"><span class="stat-name">${label}</span><b>${value}</b></span>`;
}

function drawPanel(d) {
  const sidebar = document.querySelector("aside");
  sidebar.style.setProperty("--actor-color", PLAYER_UI_COLORS[d.actor]);
  document.getElementById("actor-note").textContent =
    d.actor === llmSeat ? "model acting" : "agent acting";
  document.getElementById("players-note").textContent =
    `${Object.keys(d.players).length} seats`;
  document.getElementById("phase").innerHTML =
    `<span class="turn"><small>Turn</small>${d.turn}</span>` +
    `<span><span class="actor-label">${d.actor}</span>` +
    `<span class="phase-name">${d.phase.replaceAll("_", " ").toLowerCase()}</span></span>`;
  const dice = document.getElementById("dice");
  dice.innerHTML = Array.isArray(d.result)
    ? `<span>rolled</span><span class="die">${d.result[0]}</span>` +
      `<span class="dice-op">+</span><span class="die">${d.result[1]}</span>` +
      `<span class="dice-total">${d.result[0] + d.result[1]} total</span>`
    : "";
  const players = document.getElementById("players");
  players.innerHTML = "";
  for (const [color, p] of Object.entries(d.players)) {
    const div = document.createElement("div");
    div.className = "player" + (color === d.actor ? " actor" : "");
    div.style.setProperty("--player-color", PLAYER_UI_COLORS[color]);
    const devs = Object.values(p.devs_in_hand).reduce((a, b) => a + b, 0);
    const badges =
      (p.has_longest_road ? '<span class="badge">longest road</span>' : "") +
      (p.has_largest_army ? '<span class="badge">largest army</span>' : "");
    const finalVp = idx === decisions.length - 1 && game.outcome
      ? game.outcome.final_vps[color]
      : null;
    const vp = finalVp ?? (
      p.vps_actual === p.vps_public ? p.vps_actual : `${p.vps_public} (${p.vps_actual})`
    );
    const isModel = game.seats[color] === "llm";
    const seat = isModel ? "model" : "value";
    div.innerHTML =
      `<div class="prow"><span class="pname">${color}</span>` +
      `<span class="ptag${isModel ? " is-model" : ""}">${seat}</span>` +
      `${badges}<span class="vp">${vp}<small>vp</small></span></div>` +
      `<div class="hand">${fmtHand(p.hand)}${stat("cards", devs)}${stat("road", p.road_len)}</div>`;
    players.appendChild(div);
  }
  document.getElementById("bank").innerHTML =
    fmtHand(d.bank.resources) + stat("cards", d.bank.dev_cards_left);
  const chosen = d.legal_actions[d.chosen_action];
  const actionCount = d.legal_actions.length;
  document.getElementById("action-count").textContent =
    `${actionCount} legal ${actionCount === 1 ? "move" : "moves"}`;
  const decision = document.getElementById("decision");
  decision.innerHTML = chosen
    ? `<span class="decision-kicker">${d.actor === llmSeat ? "model chose" : `${d.actor.toLowerCase()} chose`}</span>` +
      `<span class="decision-text">${fmtAction(chosen)}</span>`
    : `<span class="decision-kicker">No choice</span><span class="decision-text">Waiting</span>`;
  const alternativesLabel = document.getElementById("alternatives-label");
  alternativesLabel.style.display = actionCount > 1 ? "block" : "none";
  const actions = document.getElementById("actions");
  actions.innerHTML = "";
  d.legal_actions.forEach((action, i) => {
    if (i === d.chosen_action) return;
    const div = document.createElement("div");
    div.textContent = fmtAction(action);
    actions.appendChild(div);
  });
  const modelSeat = document.getElementById("model-seat");
  const modelColor = PLAYER_UI_COLORS[llmSeat] || PLAYER_UI_COLORS.WHITE;
  modelSeat.style.setProperty("--model-color", modelColor);
  modelSeat.classList.toggle("active", d.actor === llmSeat);
  document.getElementById("model-seat-label").textContent = llmSeat || "unassigned";
  document.getElementById("model-seat-status").textContent =
    d.actor === llmSeat ? "acting" : "watching";
  const modelSeatPiece = document.getElementById("model-seat-piece");
  modelSeatPiece.setAttribute(
    "points",
    offsetShapePoints(0, 0, JSETTLERS_SHAPES.settlement, 1),
  );
  modelSeatPiece.setAttribute("fill", PLAYER_COLORS[llmSeat] || PLAYER_COLORS.WHITE);
  modelSeatPiece.setAttribute("stroke", PIECE_OUTLINE);
  modelSeatPiece.setAttribute("stroke-width", "1.1");
  modelSeatPiece.setAttribute("stroke-linejoin", "round");
  const outcome = document.getElementById("outcome");
  if (idx === decisions.length - 1 && game.outcome) {
    outcome.style.display = "block";
    outcome.textContent = `Winner: ${game.outcome.winner ?? "none"} · ` +
      Object.entries(game.outcome.final_vps).map(([c, v]) => `${c} ${v}`).join(" · ") +
      `${game.outcome.truncated ? " (truncated)" : ""}`;
  } else {
    outcome.style.display = "none";
  }
}

function render() {
  const d = decisions[idx];
  drawState(d);
  drawPanel(d);
  caption(d);
  document.getElementById("slider").value = idx;
  document.getElementById("step").textContent =
    `${idx + 1} / ${decisions.length}` + (d.actor === llmSeat ? " · model" : "");
  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").disabled = idx === decisions.length - 1;
  document.getElementById("playpause").disabled = idx === decisions.length - 1;
  document.getElementById("prevllm").disabled =
    !decisions.slice(0, idx).some((decision) => decision.actor === llmSeat);
  document.getElementById("nextllm").disabled =
    !decisions.slice(idx + 1).some((decision) => decision.actor === llmSeat);
}

function go(i) {
  idx = Math.max(0, Math.min(decisions.length - 1, i));
  render();
}

function seekLLM(direction) {
  for (let i = idx + direction; i >= 0 && i < decisions.length; i += direction) {
    if (decisions[i].actor === llmSeat) return go(i);
  }
}

function stopPlay() {
  if (timer) clearTimeout(timer);
  timer = null;
  document.getElementById("playpause").textContent = "Play";
}

function significant(d, next) {
  if (!next) return true;
  return JSON.stringify(d.board) !== JSON.stringify(next.board);
}

function tick() {
  if (idx >= decisions.length - 1) return stopPlay();
  go(idx + 1);
  const mult = Number(document.getElementById("speed").value);
  const changed = significant(decisions[idx - 1] || decisions[idx], decisions[idx]);
  timer = setTimeout(tick, (changed ? 750 : 110) * mult);
}

function togglePlay() {
  if (timer) return stopPlay();
  document.getElementById("playpause").textContent = "Pause";
  tick();
}

function load(text, name) {
  const lines = text.split("\n").filter(Boolean).map(JSON.parse);
  game = lines.find((line) => line.type === "game");
  decisions = lines.filter((line) => line.type === "decision");
  if (!game || !decisions.length) { alert("no game record found in file"); return; }
  llmSeat = Object.keys(game.seats).find((c) => game.seats[c] === "llm") || null;
  const gameInfo = document.getElementById("gameinfo");
  const engine = (game.engine_version || "unknown").replace(/^catanatron-/, "");
  gameInfo.textContent = `seed ${game.seed} · engine ${engine} · ${decisions.length} decisions`;
  gameInfo.title = name;
  document.getElementById("slider").max = decisions.length - 1;
  document.getElementById("drop").classList.add("hidden");
  stopPlay();
  drawStatic();
  go(0);
}

function loadFile(file) {
  file.text().then((text) => load(text, file.name));
}

document.getElementById("file").addEventListener("change", (e) => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});
document.getElementById("openfile").addEventListener("click", () => document.getElementById("file").click());
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
document.getElementById("drop").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("prev").addEventListener("click", () => go(idx - 1));
document.getElementById("next").addEventListener("click", () => go(idx + 1));
document.getElementById("prevllm").addEventListener("click", () => seekLLM(-1));
document.getElementById("nextllm").addEventListener("click", () => seekLLM(1));
document.getElementById("playpause").addEventListener("click", togglePlay);
document.getElementById("slider").addEventListener("input", (e) => { stopPlay(); go(Number(e.target.value)); });
window.addEventListener("keydown", (e) => {
  if (!decisions.length) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); stopPlay(); go(idx - 1); }
  if (e.key === "ArrowRight") { e.preventDefault(); stopPlay(); go(idx + 1); }
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
});

const params = new URLSearchParams(location.search);
if (params.get("file")) {
  fetch(params.get("file"))
    .then((r) => r.text())
    .then((text) => {
      load(text, params.get("file").split("/").pop());
      if (params.has("step")) go(Number(params.get("step")));
    });
}
</script>
