[project]
name = "catan-v1"
version = "0.1.4"
description = "Seeded Settlers of Catan against scripted bots or in self-play"
readme = "README.md"
tags = ["game", "strategy", "multi-turn", "train", "eval"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.2",
    "catanatron @ git+https://github.com/taziksh/catanatron.git@89e9397e05ed02d56c911f90ca199a0e382c2eb4",
    "datasets>=4.5.0",
    "pydantic>=2.13.4",
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@b8636f925291efb72bc1c92652eb559668c76d4a",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [".prime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["catan_v1", "catan_v1_harness", "catan_llm"]

[tool.hatch.metadata]
allow-direct-references = true
