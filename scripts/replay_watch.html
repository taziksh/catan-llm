<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catan LLM replay</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body { background: #111; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
  header {
    height: 68px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 22px;
    background: #161616;
    border-bottom: 1px solid #ffffff24;
  }
  a { color: #8fc5ff; text-decoration: none; font-size: 14px; }
  h1 { font-size: 19px; margin: 0 0 3px; }
  p { color: #b8c1ca; font-size: 13px; margin: 0; }
  iframe { display: block; width: 100%; height: calc(100% - 68px); border: 0; }
</style>
</head>
<body>
<header>
  <a id="all-replays" href="/">← all replays</a>
  <div class="identity">
    <h1 id="title">Loading model identity…</h1>
    <p id="details"></p>
  </div>
</header>
<iframe id="viewer" title="Catan replay"></iframe>
<script>
  const gameId = new URLSearchParams(location.search).get("game_id")
    || decodeURIComponent(location.pathname.split("/").pop());
  const hostedViewer = document.querySelector('meta[name="replay-viewer-url"]')?.content;
  if (hostedViewer) document.getElementById("all-replays").href = "/replays";
  const localHostnames = new Set(["localhost", "127.0.0.1"]);
  const viewerOrigin = localHostnames.has(location.hostname)
    ? "http://localhost:3000"
    : `${location.protocol}//${location.hostname}:3000`;
  document.getElementById("viewer").src = hostedViewer
    ? `${hostedViewer.replace(/\/$/, "")}/#/replays/${encodeURIComponent(gameId)}`
    : `${viewerOrigin}/replays/${encodeURIComponent(gameId)}`;

  function playerSummary(game) {
    const counts = new Map();
    (game.seat_kinds || []).filter(Boolean).forEach((kind) => {
      const label = kind.replaceAll("_", " ");
      counts.set(label, (counts.get(label) || 0) + 1);
    });
    return [...counts].map(([label, amount]) => `${amount}× ${label}`).join(" · ");
  }

  fetch("/api/replays")
    .then((response) => {
      if (!response.ok) throw new Error(`catalog request failed (${response.status})`);
      return response.json();
    })
    .then((games) => {
      const game = games.find((entry) => entry.game_id === gameId);
      if (!game) throw new Error("replay metadata not found");
      const model = game.model_label || (game.model_color ? "Unidentified LLM" : null);
      const heading = model && game.model_color
        ? `${model} plays ${game.model_color}`
        : "Catan game replay";
      const details = [
        game.seed === null ? null : `Seed ${game.seed}`,
        playerSummary(game),
        `${game.turns} turns`,
      ].filter(Boolean);
      document.title = `${heading} — Catan replay`;
      document.getElementById("title").textContent = heading;
      document.getElementById("details").textContent = details.join(" · ");
    })
    .catch((error) => {
      document.getElementById("title").textContent = "LLM replay";
      document.getElementById("details").textContent = String(error);
    });
</script>
</body>
</html>
